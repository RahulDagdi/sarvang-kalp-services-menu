<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarvang Kalp – Services Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@400;500;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style id="sk-style">
:root{
  --bg:#F1F0E4;--surface:#FBFAF3;--ink:#1A2A21;--muted:#56665B;--line:#D9D7C3;--chip:#E6E7D3;
  --forest:#1E4D33;--accent-text:#1E5A39;--brass:#9A6B22;--brass-soft:#E9DDBF;--btn:#1E4D33;--btn-ink:#FFFFFF;
  --danger:#A3352B;--ok:#2F7A4A;
  --display:"Marcellus","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Mukta","Segoe UI",system-ui,-apple-system,sans-serif;
  --deva:"Tiro Devanagari Hindi","Noto Serif Devanagari","Mangal",serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1712;--surface:#15221B;--ink:#E8ECE1;--muted:#A0B1A4;--line:#2B3C31;--chip:#1E2E25;
  --forest:#9ED0AE;--accent-text:#9ED0AE;--brass:#DDB06A;--brass-soft:#3A3122;--btn:#2E6B48;--btn-ink:#FFFFFF;--danger:#E58A80;--ok:#7CC496;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1712;--surface:#15221B;--ink:#E8ECE1;--muted:#A0B1A4;--line:#2B3C31;--chip:#1E2E25;
  --forest:#9ED0AE;--accent-text:#9ED0AE;--brass:#DDB06A;--brass-soft:#3A3122;--btn:#2E6B48;--btn-ink:#FFFFFF;--danger:#E58A80;--ok:#7CC496;color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand img{width:40px;height:40px;border-radius:50%}
.brand b{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.01em;white-space:nowrap}
.nav{margin-left:auto;display:flex;gap:4px}
.nav a{position:relative;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:999px;font-weight:500;font-size:16px;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--chip);color:var(--ink)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--brass);color:#fff;font-size:12px;font-weight:700;vertical-align:1px}
.admin-btn{border:1px dashed var(--brass);background:transparent;color:var(--brass);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
@media (max-width:640px){
  .brand b{display:none}
  .nav a{padding:8px 10px;font-size:15px}
  .admin-btn{padding:6px 9px}
}

/* hero */
.hero{padding:44px 0 30px;text-align:center}
.hero .hi{font-family:var(--deva);color:var(--brass);font-size:clamp(54px,11vw,104px);line-height:1.05;margin:0}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,4vw,34px);margin:6px 0 2px;letter-spacing:.02em}
.hero .tag{color:var(--accent-text);font-weight:500;margin:0}
.hero p.intro{max-width:56ch;margin:14px auto 0;color:var(--muted)}

/* filters */
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:15;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;gap:10px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.search{flex:0 0 200px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px}
@media (max-width:640px){.filters .wrap{flex-direction:column;align-items:stretch}.search{flex:auto}}

/* services */
.cat{padding:28px 0 6px}
.cat h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 4px;display:flex;align-items:baseline;gap:12px}
.cat h2 small{font-family:var(--body);font-size:15px;color:var(--muted)}
.svc{display:grid;grid-template-columns:210px 1fr 200px;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0}
.svc .ph{background:var(--chip);min-height:160px}
.svc .ph img{width:100%;height:100%;object-fit:cover}
.svc .ph.empty{display:grid;place-items:center;font-family:var(--deva);color:var(--brass);font-size:42px}
.svc .bd{padding:16px 20px}
.svc h3{font-family:var(--display);font-weight:400;font-size:23px;line-height:1.2;margin:0}
.svc .sub{color:var(--brass);font-weight:500;font-size:15px;margin:2px 0 0}
.svc .desc{margin:8px 0 0;color:var(--ink);max-width:60ch}
.ben{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:15px;color:var(--muted)}
.ben li{display:flex;gap:7px;align-items:flex-start}
.ben svg{flex:none;margin-top:5px;color:var(--ok)}
.svc .side{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.dur{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px}
.opt{display:flex;flex-direction:column;gap:6px}
.opt .lbl{font-size:14px;color:var(--muted);margin-bottom:-4px}
.price{font-family:var(--display);font-size:26px;line-height:1.1}
.price.small{font-size:16px;font-family:var(--body);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:9px 16px;font-weight:500;cursor:pointer;text-decoration:none;font-size:16px;line-height:1.2}
.btn.ghost{background:transparent;color:var(--accent-text);border-color:var(--line)}
.btn.on{background:var(--brass-soft);color:var(--ink);border-color:var(--brass)}
.btn.wa{background:#1F8A4C;border-color:#1F8A4C;color:#fff}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
@media (max-width:820px){
  .svc{grid-template-columns:1fr}
  .svc .ph{aspect-ratio:16/9;min-height:0}
  .svc .side{border-left:0;border-top:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
  .svc .side .opt{flex:1 1 140px}
}
@media (max-width:480px){.ben{grid-template-columns:1fr}}
.empty-state{padding:40px 0;text-align:center;color:var(--muted)}

/* tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(20,40,28,.12);display:none}
.tray.show{display:block}
.tray .wrap{display:flex;align-items:center;gap:14px}
.tray .sum{flex:1;min-width:0}
.tray .sum b{font-family:var(--display);font-size:22px;font-weight:400}
.tray .sum span{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad-tray{height:96px}

/* pages */
.page{padding:28px 0 40px}
.page h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,40px);margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 22px;max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.line{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-of-type{border-bottom:0}
.line .nm{font-weight:500}
.line .nm small{display:block;color:var(--muted);font-weight:400}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:transparent;width:32px;height:32px;cursor:pointer;font-size:18px}
.qty span{min-width:22px;text-align:center}
.amt{min-width:84px;text-align:right;font-weight:500}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:4px;border-top:2px solid var(--ink)}
.total b{font-family:var(--display);font-size:28px;font-weight:400}
.note{font-size:14px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:500;font-size:15px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;font-size:16px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
@media (max-width:480px){.row{flex-direction:column;gap:0}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mode{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--bg);text-align:left}
.mode b{display:block;font-weight:500}
.mode span{font-size:14px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--btn);box-shadow:inset 0 0 0 1px var(--btn);background:var(--surface)}
.qrbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.qrimg{width:200px;height:200px;background:#fff;border-radius:12px;padding:10px;border:1px solid var(--line);display:grid;place-items:center}
.qrimg img,.qrimg canvas{width:100%;height:100%;object-fit:contain}
.qrinfo{flex:1;min-width:180px}
.qrinfo .big{font-family:var(--display);font-size:32px;line-height:1}
.copy{border:0;background:none;color:var(--accent-text);cursor:pointer;text-decoration:underline;padding:0;font-size:15px}
.err{color:var(--danger);font-size:14px;margin:-6px 0 10px}
.fallback{margin-top:10px;font-size:15px}
.ctc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:16px}
.ctc .panel{margin:0}
.ctc h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.ctc .role{color:var(--brass);font-size:15px;margin:0 0 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.loc{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.loc .q{width:150px;background:#fff;border-radius:10px;padding:8px;border:1px solid var(--line)}
.loc address{font-style:normal;flex:1;min-width:220px}
ol.ins{margin:0;padding-left:20px}
ol.ins li{margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:90;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:14px;text-align:center}

/* admin */
.adm{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.adm[hidden]{display:none}
.adm-h{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.adm-h h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;margin-right:auto}
.dirty{font-size:14px;color:var(--brass);font-weight:500}
.adm-b{flex:1;display:flex;min-height:0}
.adm-tabs{flex:0 0 190px;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.adm-tabs button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:15px}
.adm-tabs button[aria-selected="true"]{background:var(--chip);font-weight:500}
.adm-c{flex:1;overflow:auto;padding:18px 20px 60px}
.adm-c h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 10px}
@media (max-width:720px){
  .adm-b{flex-direction:column}
  .adm-tabs{flex:none;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .adm-tabs button{white-space:nowrap}
}
.alist{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.arow.off{opacity:.55}
.arow img,.arow .noimg{width:56px;height:42px;object-fit:cover;border-radius:6px;background:var(--chip)}
.arow .t b{font-weight:500}
.arow .t small{display:block;color:var(--muted);font-size:13px}
.arow .a{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ibtn{border:1px solid var(--line);background:var(--bg);border-radius:7px;min-width:32px;height:32px;padding:0 8px;cursor:pointer;font-size:14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.check{display:flex;gap:8px;align-items:center;margin-bottom:10px;cursor:pointer}
.check input{width:18px;height:18px}
.pricerow{display:grid;grid-template-columns:1fr 120px 36px;gap:8px;margin-bottom:6px}
.pricerow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;width:100%}
.imgedit{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.imgedit .pv{width:160px;height:110px;border-radius:10px;background:var(--chip);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px}
.imgedit .pv img{width:100%;height:100%;object-fit:contain}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,20,14,.5);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:var(--surface);border-radius:14px;width:min(680px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px}
.modal .box h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 14px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px;position:sticky;bottom:-20px;background:var(--surface);padding:12px 0}
.modal .foot .left{margin-right:auto}
.banner{background:var(--brass-soft);border-bottom:1px solid var(--brass);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
.banner span{margin-right:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script id="sk-main">
(function(){
"use strict";
const ORIGINAL_JSON = document.getElementById('sk-data').textContent;
const STYLE_TEXT = document.getElementById('sk-style').textContent;
const MAIN_TEXT = document.getElementById('sk-main').textContent;
let DATA = JSON.parse(ORIGINAL_JSON);
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Number(n||0).toLocaleString('en-IN');
const uid = p => p + Math.random().toString(36).slice(2,8);
const tick = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="currentColor" opacity=".16"/><path d="M4.6 8.3l2.2 2.2 4.6-4.9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const clock = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.4V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const waIcon = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.6-.3z"/></svg>';

/* ---------- state ---------- */
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let cart = store.get('sk-cart') || [];            // [{sid, vi, qty}]
let form = store.get('sk-form') || {name:'',phone:'',date:'',time:'',note:'',mode:'pay',txn:'',payer:'',to:''};
let activeCat = 'all', query = '';
let isAdmin = false, artifactNS = null, dirty = false, adminTab = 'services', adminCatFilter = 'all';

const svcById = id => DATA.services.find(s => s.id === id);
function cleanCart(){
  cart = cart.filter(c => { const s = svcById(c.sid); return s && s.visible && (s.consult || s.prices[c.vi]); });
}
function saveCart(){ store.set('sk-cart', cart); }
function saveForm(){ store.set('sk-form', form); }
function lineAmount(c){ const s = svcById(c.sid); if(!s || s.consult) return 0; return (s.prices[c.vi]?.price || 0) * c.qty; }
function cartTotal(){ return cart.reduce((a,c)=>a+lineAmount(c),0); }
function cartCount(){ return cart.reduce((a,c)=>a+c.qty,0); }
function inCart(sid,vi){ return cart.findIndex(c => c.sid===sid && c.vi===vi); }
function toggleCart(sid,vi){
  const i = inCart(sid,vi);
  if(i>=0) cart.splice(i,1); else cart.push({sid,vi,qty:1});
  saveCart(); renderNavBadge(); refreshServiceButtons(); renderTray();
}

/* ---------- shell ---------- */
function shell(){
  const S = DATA.settings;
  document.title = S.name + ' – Services Menu';
  $('#app').innerHTML = `
  <header class="top"><div class="wrap">
    <a class="brand" href="#services">${DATA.images.logo ? `<img src="${DATA.images.logo}" alt="">` : ''}<b>${esc(S.name)}</b></a>

      <a href="#services" data-v="services">Services</a>
      <a href="#book" data-v="book">Book &amp; pay<span class="badge" id="nb" hidden></span></a>

    <button class="admin-btn" id="admOpen" hidden>Manage menu</button>
  </div></header>
  <div id="draftBanner"></div>
  <main id="view"></main>
  <footer><div class="wrap">${esc(S.name)}, ${esc(S.tagline)}<br>${esc(S.address)}</div></footer>
  <div class="tray" id="tray"></div>
  <div class="toast" id="toast" role="status"></div>
  <section class="adm" id="adm" hidden aria-label="Manage menu"></section>
  <div class="modal" id="modal" hidden></div>`;
  $('#admOpen').hidden = !isAdmin;
  $('#admOpen').onclick = openAdmin;
  renderNavBadge();
}
function renderNavBadge(){
  const b = $('#nb'); if(!b) return;
  const n = cartCount(); b.hidden = !n; b.textContent = n;

function matches(s){

    html += `<section class="cat" id="cat-${c.id}"><h2>${esc(c.name)} <small>${items.length} ${items.length===1?'option':'options'}</small></h2>${items.map(svcCard).join('')}</section>`;

function svcCard(s){
  const ph = s.img ? `<div class="ph"><img src="${s.img}" alt="${esc(s.name)}" loading="lazy"></div>` : `<div class="ph empty" aria-hidden="true">ॐ</div>`;
  const ben = (s.benefits||[]).filter(Boolean);
  let opts;
  if(s.consult){
    opts = `<div class="opt"><div class="price small">Price on consultation</div>${addBtn(s.id,0,'Add to enquiry')}</div>`;
  } else {
    opts = s.prices.map((p,i)=>`<div class="opt">${p.label?`<div class="lbl">${esc(p.label)}</div>`:''}<div class="price">${money(p.price)}</div>${addBtn(s.id,i,'Add')}</div>`).join('');

      ${s.desc?`<p class="desc">${esc(s.desc)}</p>`:''}

function copyText(t){
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast('Copied'), ()=>toast('Copy failed. Select the text and copy it.'));
}
function buildMessage(paid){
  const S = DATA.settings, lines = [];
  lines.push(`*${paid ? 'Booking with payment' : 'New booking'} – ${S.name}*`, '');
  lines.push(`Name: ${form.name.trim()}`);
  if(form.phone.trim()) lines.push(`Mobile: ${form.phone.trim()}`);
  if(form.date || form.time) lines.push(`Preferred slot: ${[fmtDate(form.date), form.time].filter(Boolean).join(', ')}`);
  lines.push('', '*Therapies*');
  cart.forEach((c,i) => { const s = svcById(c.sid);
    lines.push(`${i+1}. ${itemName(c)}${c.qty>1?' × '+c.qty:''} – ${s.consult ? 'on consultation' : money(lineAmount(c))}${s.duration?' ('+s.duration+')':''}`); });
  lines.push('', `*Total: ${money(cartTotal())}*`);
  if(paid){
    lines.push(`Payment: Paid by UPI QR`, `Transaction ID: ${form.txn.trim()}`);
    if(form.payer.trim()) lines.push(`Paid from: ${form.payer.trim()}`);
    lines.push('Payment screenshot: attached below');
  } else lines.push('Payment: At the centre');
  if(form.note.trim()) lines.push('', `Note: ${form.note.trim()}`);
  return lines.join('\n');
}
function fmtDate(d){ if(!d) return ''; const x = new Date(d+'T00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function send(paid){
  const err = [];
  if(!form.name.trim()) err.push('your name');
  if(paid && form.txn.trim().length < 6) err.push('the transaction ID from your UPI app');
  const to = (form.to || DATA.settings.whatsapp || '').replace(/\D/g,'');
  if(!to) { $('#perr').innerHTML = `<p class="err">WhatsApp number isn’t set up yet. Call us from the Contact page.</p>`; return; }
  if(err.length){ $('#perr').innerHTML = `<p class="err">Add ${err.join(' and ')} to continue.</p>`; return; }
  $('#perr').innerHTML = '';
  openWa(to, buildMessage(paid));
}
function openWa(num, text){
  const url = `https://wa.me/${num.replace(/\D/g,'')}` + (text ? `?text=${encodeURIComponent(text)}` : '');
  let w = null; try{ w = window.open(url, '_blank', 'noopener'); }catch(e){}
  const fb = $('#fb');
  if(fb) fb.innerHTML = `<p class="fallback">WhatsApp didn’t open? <a href="${esc(url)}" target="_blank" rel="noopener">Tap here to open the chat</a>.</p>`;
}

        ${s.prices.map((p,i)=>`<div class="pricerow"><input data-pl="${i}" value="${esc(p.label)}" placeholder="Option name (optional)" aria-label="Option name"><input data-pp="${i}" type="number" min="0" value="${p.price}" aria-label="Price in rupees"><button class="ibtn" data-pr="${i}" aria-label="Remove price" ${s.prices.length<2?'disabled':''}>×</button></div>`).join('')}

      </div>
      <div class="field" style="margin-top:14px"><label>Photo</label>
        <div class="imgedit"><div class="pv">${s.img?`<img src="${s.img}" alt="">`:'No photo'}</div>
        <div><label class="btn ghost sm" style="cursor:pointer">Upload photo<input type="file" accept="image/*" id="e-img" class="sr"></label>
        ${s.img?` <button class="btn ghost sm" id="e-rmimg">Remove</button>`:''}<p class="note">Wide photos (landscape) look best.</p></div></div>
      </div>
      <label class="check"><input type="checkbox" id="e-vis" ${s.visible?'checked':''}> Show on menu</label>
      <div class="foot">${isNew?'':'<button class="btn danger left" id="e-del">Delete</button>'}<button class="btn ghost" id="e-cancel">Cancel</button><button class="btn" id="e-save">Save</button></div>
    </div>`;
    const read = () => {
      s.name = $('#e-name').value.trim(); s.sub = $('#e-sub').value.trim(); s.cat = $('#e-cat').value; s.duration = $('#e-dur').value.trim();
      s.desc = $('#e-desc').value.trim(); s.benefits = $('#e-ben').value.split('\n').map(x=>x.trim()).filter(Boolean);

      m.querySelectorAll('[data-pl]').forEach(inp => s.prices[+inp.dataset.pl].label = inp.value.trim());
      m.querySelectorAll('[data-pp]').forEach(inp => s.prices[+inp.dataset.pp].price = Math.max(0, Math.round(+inp.value||0)));
    };
    $('#e-cons').onchange = () => { $('#e-prices').hidden = $('#e-cons').checked; };
    $('#e-addp').onclick = () => { read(); s.prices.push({label:'',price:0}); draw(); };
    m.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => { read(); s.prices.splice(+b.dataset.pr,1); draw(); });
    $('#e-img').onchange = async e => { const f = e.target.files[0]; if(!f) return; read(); try{ s.img = await shrink(f, 720, .8); draw(); }catch(x){ toast('That file isn’t an image we can read'); } };

      if(s.prices.length===1) s.prices[0].label = s.prices[0].label || '';

  draw();

function shrink(file, max, q){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      const cx = cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL('image/jpeg', q)); }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

    const v = DATA.settings[k];
    if(type==='check') return `<label class="check"><input type="checkbox" data-s="${k}" ${v?'checked':''}> ${label}</label>`;
    if(type==='area' || type==='lines') return `<div class="field"><label for="s-${k}">${label}</label><textarea id="s-${k}" data-s="${k}" data-type="${type}" placeholder="${esc(ph||'')}">${esc(type==='lines'?(v||[]).join('\n'):v)}</textarea></div>`;
    return `<div class="field"><label for="s-${k}">${label}</label><input id="s-${k}" data-s="${k}" value="${esc(v)}" placeholder="${esc(ph||'')}" ${type==='num'?'inputmode="numeric"':''}></div>`;
  }).join('');
}
function bindSettings(){

}

/* publish */
function buildHTML(){
  const json = JSON.stringify(DATA).replace(/</g,'\\u003c');
  const title = esc(DATA.settings.name) + ' – Services Menu';
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>' + title + '</title>\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
    + '<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@400;500;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">\n'
    + '<style id="sk-style">' + STYLE_TEXT + '</style>\n</head>\n<body>\n<div id="app"></div>\n'
    + '<script id="sk-data" type="application/json">' + json + '<\/script>\n'
    + '<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>\n'
    + '<script id="sk-main">' + MAIN_TEXT + '<\/script>\n</body>\n</html>\n';
}
async function publish(){
  const btn = $('#pubBtn');
  if(!artifactNS){ toast('Publishing isn’t available in this view'); return; }
  btn.disabled = true; btn.textContent = 'Publishing…';
  try{
    const html = buildHTML();
    store.set('sk-draft', {at:Date.now(), json: JSON.stringify(DATA)});
    await artifactNS.publish(html);
    store.del('sk-draft'); dirty = false; toast('Published. The menu is updating.');
    btn.textContent = 'Published';
  }catch(e){
    const code = e && e.code;
    btn.textContent = 'Publish changes'; btn.disabled = false;
    if(code==='conflict'){ toast('Someone else just published. The page is reloading; your changes are kept as a draft.'); return; }
    if(code==='not_writer' || code==='not_granted'){ toast('You can view this menu but can’t publish changes to it.'); isAdmin=false; return; }
    if(code==='too_large'){ toast('The menu is too large. Remove or replace some big photos.'); return; }
    if(code==='rate_limited'){ toast('Too many publishes in a row. Wait a minute and try again.'); return; }
    toast('Publish failed' + (e && e.message ? ': ' + e.message : '. Try again.'));
  }
}

  try{

    artifactNS = await claude.use('artifact');
    if(!artifactNS) return;
    isAdmin = true;
    const b = $('#admOpen'); if(b) b.hidden = false;
    renderDraftBanner();
  }catch(e){}
})();
})();
